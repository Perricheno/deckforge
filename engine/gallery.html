<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentations</title>
<meta name="theme-color" content="#fafaf8">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';font-weight:300 700;font-display:swap;src:url(/fonts/inter-latin.woff2) format('woff2')}
:root{--bg:#fafaf8;--card:#fff;--ink:#141412;--body:#3d3d38;--mute:#6f6f69;--faint:#a9a9a2;--line:#e5e5df;--tint:#f1f1ec;--acc:#ff4b1f}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font:400 14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);font-feature-settings:'cv11','ss03';-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
.wrap{width:min(1180px,100% - 48px);margin:0 auto}
header{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.86);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
header.s{border-color:var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(255,75,31,.5);animation:ping 3s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(255,75,31,0)}100%{box-shadow:0 0 0 0 rgba(255,75,31,0)}}
.sp{flex:1}
.search{position:relative;width:min(280px,45vw)}
.search input{width:100%;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 40px 0 38px;outline:none;transition:.2s}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(20,20,18,.06)}
.search svg{position:absolute;left:13px;top:11px;width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round}
.search kbd{position:absolute;right:10px;top:9px;font:500 11px Inter;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.rb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:.2s}
.rb:hover{border-color:var(--ink)}
.rb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{padding:44px 0 20px}
.hero h1{font-size:clamp(30px,4.4vw,46px);font-weight:600;letter-spacing:-.04em;line-height:1.05;max-width:720px}
.hero h1 span{color:var(--faint)}
.hero p{margin-top:12px;color:var(--mute);font-size:15px;max-width:520px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 22px}
.chip{height:32px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:13px;color:var(--mute);transition:.2s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.count{margin-left:auto;color:var(--faint);font-size:12.5px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding-bottom:64px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .2s;outline:none;animation:in .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 26px 50px -30px rgba(20,20,18,.45);border-color:#cfcfc8}
.card:focus-visible{border-color:var(--ink)}
.th{position:relative;aspect-ratio:16/9;background:var(--tint);overflow:hidden;border-bottom:1px solid var(--line)}
.th iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .5s}
.th iframe.ok{opacity:1}
.th .n{position:absolute;right:10px;bottom:10px;padding:3px 9px;border-radius:99px;background:rgba(20,20,18,.78);color:#fff;font-size:11px;font-weight:500;backdrop-filter:blur(6px)}
.bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.bd h2{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.bd p{color:var(--mute);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--faint);font-size:12px;font-weight:500;margin-top:auto;padding-top:10px}
.ft{display:flex;gap:8px;align-items:center;margin-top:12px}
.btn{height:34px;padding:0 16px;border-radius:99px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);transition:.2s;position:relative;z-index:2}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:hover{border-color:var(--ink)}.btn.p:hover{background:var(--acc);border-color:var(--acc)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cover{position:absolute;inset:0;z-index:1}
.empty{display:none;text-align:center;padding:80px 0;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
footer{margin-top:auto;border-top:1px solid var(--line);padding:18px 0;color:var(--faint);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sk{height:300px;border-radius:18px;background:linear-gradient(100deg,var(--tint) 30%,#f8f8f4 50%,var(--tint) 70%);background-size:300% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-300% 0}}
@media (max-width:560px){.wrap{width:calc(100% - 32px)}.grid{grid-template-columns:1fr}.hero{padding-top:28px}.search kbd{display:none}.count{width:100%;margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd"><div class="wrap bar">
  <a class="brand" href="/"><i></i>Presentations</a><div class="sp"></div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search presentations"><kbd>/</kbd></label>
  <a class="rb" href="/admin/" title="Presenter remote (PIN)" aria-label="Presenter remote"><svg viewBox="0 0 24 24"><path d="M4.9 19.1a10 10 0 0 1 0-14.2M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M19.1 4.9a10 10 0 0 1 0 14.2"/><circle cx="12" cy="12" r="2"/></svg></a>
</div></header>
<main class="wrap">
  <section class="hero"><h1>Presentations <span>with motion, ready to present or share.</span></h1><p>Open a deck to present it. Followers join live when a presenter takes control from a phone.</p></section>
  <div class="tools" id="tools"></div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <div class="empty" id="empty"><b>Nothing matches</b>Try another word or clear the filter.</div>
</main>
<footer><div class="wrap"><span>Updates appear instantly, nothing is cached.</span><span id="ver"></span></div></footer>
<script>
(function(){
  var grid=document.getElementById('grid'),tools=document.getElementById('tools'),q=document.getElementById('q'),empty=document.getElementById('empty'),hd=document.getElementById('hd');
  var decks=[],tag='',text='';
  addEventListener('scroll',function(){hd.classList.toggle('s',scrollY>8)},{passive:true});
  addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select()}if(e.key==='Escape'&&document.activeElement===q){q.value='';text='';q.blur();draw()}});
  q.addEventListener('input',function(){text=q.value.trim().toLowerCase();draw()});
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  fetch('/decks.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){decks=d;chips();draw()}).catch(function(){grid.innerHTML='<div class="empty" style="display:block"><b>Could not load the list</b>Refresh the page.</div>'});
  function chips(){
    var tags={};decks.forEach(function(d){(d.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1})});
    var names=Object.keys(tags);if(!names.length){tools.innerHTML='<span class="count" id="cnt"></span>';return}
    tools.innerHTML='<button class="chip on" data-t="">All</button>'+names.map(function(t){return '<button class="chip" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'<span class="count" id="cnt"></span>';
    tools.onclick=function(e){var b=e.target.closest('.chip');if(!b)return;tag=b.dataset.t;[].forEach.call(tools.querySelectorAll('.chip'),function(c){c.classList.toggle('on',c===b)});draw()};
  }
  function match(d){
    if(tag&&(d.tags||[]).indexOf(tag)<0)return false;
    if(!text)return true;
    return (d.title+' '+d.subtitle+' '+(d.authors||[]).join(' ')+' '+(d.tags||[]).join(' ')).toLowerCase().indexOf(text)>=0;
  }
  function draw(){
    var list=decks.filter(match);
    grid.innerHTML=list.map(function(d,i){
      var pdf=d.pdf?'<a class="btn" href="/'+esc(d.pdf)+'" download aria-label="Download PDF"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>PDF</a>':'';
      var meta=[d.slides+' slides'].concat(d.minutes?[d.minutes+' min']:[],d.date?[d.date]:[],(d.authors||[]).length?[d.authors.map(function(a){return a.split(' ')[0]}).join(', ')]:[]).map(esc).join('<span>·</span>');
      return '<article class="card" style="--i:'+i+'" data-s="'+esc(d.slug)+'" data-n="'+d.slides+'" tabindex="0"><a class="cover" href="/'+esc(d.slug)+'/" aria-label="Open '+esc(d.title)+'"></a>'
        +'<div class="th"><iframe data-src="/'+esc(d.slug)+'/?thumb#1" title="" loading="lazy" tabindex="-1"></iframe><span class="n">'+d.slides+'</span></div>'
        +'<div class="bd"><h2>'+esc(d.title)+'</h2><p>'+esc(d.subtitle)+'</p><div class="meta">'+meta+'</div>'
        +'<div class="ft"><a class="btn p" href="/'+esc(d.slug)+'/">Open</a>'+pdf+'</div></div></article>';
    }).join('');
    empty.style.display=list.length?'none':'block';
    var c=document.getElementById('cnt');if(c)c.textContent=list.length+' of '+decks.length;
    thumbs();
  }
  /* live thumbnails: scale to the card, load when visible, flip through slides on hover */
  function thumbs(){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var f=e.target.querySelector('iframe');if(f&&!f.src){f.src=f.dataset.src;f.onload=function(){f.classList.add('ok')}}io.unobserve(e.target)}})},{rootMargin:'200px'});
    [].forEach.call(grid.querySelectorAll('.card'),function(card){
      var th=card.querySelector('.th'),f=th.querySelector('iframe'),n=+card.dataset.n,tm=null,k=0;
      var fit=function(){f.style.transform='scale('+th.clientWidth/1280+')'};fit();new ResizeObserver(fit).observe(th);io.observe(card);
      var go=function(i){try{f.contentWindow.postMessage({deckforge:'go',slide:i},'*')}catch(e){}};
      var start=function(){if(tm||n<2)return;tm=setInterval(function(){k=(k+1)%n;go(k)},1700)};
      var stop=function(){clearInterval(tm);tm=null;k=0;go(0)};
      card.addEventListener('mouseenter',start);card.addEventListener('mouseleave',stop);card.addEventListener('focus',start);card.addEventListener('blur',stop);
      card.addEventListener('keydown',function(e){if(e.key==='Enter')location.href='/'+card.dataset.s+'/'});
    });
  }
})();
</script>
</body>
</html>
